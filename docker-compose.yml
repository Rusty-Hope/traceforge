services:
  api:
    build: ./backend
    environment:
      DATABASE_URL: sqlite:////data/traceforge.db
      LLM_ENABLED: ${LLM_ENABLED:-true}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      LLM_MODEL: ${LLM_MODEL:-z-ai/glm-5.3-flash}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.1}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-450}
      SIMULATE_ENABLED: ${SIMULATE_ENABLED:-true}
      RETENTION_HOURS: ${RETENTION_HOURS:-24}
      INGEST_TOKEN: ${INGEST_TOKEN:-}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      ALERT_MIN_SEVERITY: ${ALERT_MIN_SEVERITY:-high}
    volumes:
      - traceforge-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  web:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  traceforge-data:
