name: Bug report
description: Report a bug or unexpected behavior in TraceForge
title: "[bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report an issue!
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: How can maintainers reproduce this behavior?
      placeholder: |
        1. Start with `make api`
        2. Send POST /api/ingest ...
        3. Observe error ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, Docker / local, LLM mode (OpenRouter / mock / disabled)
      placeholder: "macOS / Python 3.12 / Docker Compose"
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or tracebacks
      render: shell
